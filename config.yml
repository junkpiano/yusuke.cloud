baseurl: 'https://yusuke.cloud'
title: Yusuke Ohashi
theme: PaperMod
languagecode: en
defaultcontentlanguage: en
enableEmoji: false
enableRobotsTXT: true
ignoreFiles:
  - \.gitignore$
  - ^README.md$
pagination:
  pagerSize: 20
canonifyurls: true
pygmentsstyle: monokai
pygmentscodefences: true
pygmentscodefencesguesssyntax: true
googleAnalytics: G-BYJK9D038N

buildDrafts: false
buildFuture: false
buildExpired: false

permalinks:
  posts: /:sections[1:]/:slug/

minify:
  disableXML: true
  minifyOutput: true

params:
  author: Yusuke Ohashi
  info: 'iOS Developer, DevOps, Blogger, and Gamer'
  description: Yusuke Ohashi's personal website
  keywords: ["blog", "developer", "personal"]
  avatarurl: 'https://www.gravatar.com/avatar/d3fc8d6fbff5b66d7a45ff6396824198e4d5603c9be48ec1d6c9a9ebbc07574c?s=200'

  # Text link row on the homepage; RSS is appended by layouts/index.html.
  homeLinks:
    - label: GitHub
      url: 'https://github.com/junkpiano/'
    - label: LinkedIn
      url: 'https://www.linkedin.com/in/yusukeohashi'
    - label: Mastodon
      url: 'https://hachyderm.io/@junkpiano'
    - label: nostr
      url: 'https://nox.garden/junkpiano@yusuke.cloud'
    - label: Email
      url: 'mailto:mail@yusuke.cloud'
  favicon_32: /img/favicon-32x32.png
  favicon_16: /img/favicon-16x16.png
  footercontent: Welcome to my personal website!
  displayFullLangName: true
  hidecredits: true
  hidecopyright: false
  ShowShareButtons: true
  hideSummary: true
  rtl: false
  math: true
  # customCSS:
  #   - css/gistfix.css
  colorscheme: auto
  images:
    - 'https://cdn.yusuke.cloud/assets/image/golden-gate-bridge.jpg'

  # home-info mode
  # homeInfoParams:
  #   Title: "Hi there \U0001F44B"
  #   Content: Welcome to my blog
  
  utterances:
    repo: junkpiano/yusuke.cloud
    issueTerm: pathname
  social: true
  socialIcons:
    - name: Github
      icon: fa fa-github fa-2x
      weight: 2
      url: 'https://github.com/junkpiano/'
    - name: Gitlab
      icon: fa fa-gitlab fa-2x
      weight: 3
      url: 'https://gitlab.com/junkpiano/'
    - name: Twitter
      icon: fa fa-twitter fa-2x
      weight: 1
      url: 'https://twitter.com/junkpiano/'
    - name: Linkedin
      icon: fa fa-linkedin fa-2x
      weight: 4
      url: 'https://www.linkedin.com/in/yusukeohashi'
    - name: Mastodon
      icon: fa fa-mastodon fa-2x
      weight: 5
      url: 'https://hachyderm.io/@junkpiano'
      rel: me
taxonomies:
  category: categories
  series: series
  tag: tags
  author: authors
